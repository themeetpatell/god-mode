<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>God Mode</title>
<style>
  body { font: 14px -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 12px; background: #0a0a0f; color: #e8eaf0; }
  h1 { font-size: 14px; margin: 0 0 8px; color: #7c5cff; }
  textarea { width: 100%; min-height: 80px; background: #12131a; color: #e8eaf0; border: 1px solid #2a2d3a; border-radius: 6px; padding: 8px; }
  button { background: #7c5cff; color: white; border: 0; padding: 8px 16px; border-radius: 6px; margin-top: 8px; cursor: pointer; }
  #out { margin-top: 12px; font-size: 12px; color: #888b9a; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>● God Mode</h1>
<p style="font-size: 12px; color: #888b9a; margin: 0 0 8px;">What's the goal on this page?</p>
<textarea id="goal" placeholder="e.g., Summarize this article into a LinkedIn post in my voice"></textarea>
<button id="run">Run God Mode</button>
<div id="out"></div>
<script src="sidepanel.js"></script>
</body>
</html>
